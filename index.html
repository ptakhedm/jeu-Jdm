<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu de Calcul Mental - Collège</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; }
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .teams-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .team-box { background: #ecf0f1; padding: 10px; border-radius: 6px; text-align: center; }
        .team-box h3 { margin: 0 0 5px 0; font-size: 1rem; color: #2c3e50; }
        .score { font-size: 1.5rem; font-weight: bold; color: #2980b9; }
        button { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #2980b9; }
        .timer { font-size: 2rem; font-weight: bold; text-align: center; color: #e74c3c; margin: 15px 0; }
        .modalite { background: #e8f8f5; border-left: 5px solid #2ecc71; padding: 15px; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>Calcul Mental - 6ème</h1>
        <div>Connecté en tant que : <span id="user-prof">Professeur</span> | <button onclick="logout()">Déconnexion</button></div>
    </header>

    <div class="container">
        <!-- Zone de Jeu Principale -->
        <div>
            <div class="card">
                <h2>Sélection de la séance et de la classe</h2>
                <label>Classe : </label>
                <select id="select-classe" onchange="chargerEleves()">
                    <option value="6A">6ème A</option>
                    <option value="6B">6ème B</option>
                    <option value="6C">6ème C</option>
                </select>
                <label style="margin-left: 20px;">Séance : </label>
                <select id="select-seance">
                    <option value="seance_10">Séance 10</option>
                    <option value="seance_11">Séance 11</option>
                </select>
            </div>

            <div class="card" id="game-card">
                <h2>Question en cours</h2>
                <p id="question-text">Cliquez sur "Démarrer le jeu" pour commencer.</p>
                <div class="timer" id="timer-display">-- s</div>
                <button onclick="lancerChrono()">Lancer le Chrono</button>
                <button onclick="afficherCorrection()" style="background: #e67e22;">Voir la Correction</button>
                
                <div class="modalite" id="correction-box" style="display:none;">
                    <strong>Correction : </strong><span id="correction-text"></span>
                </div>
            </div>

            <div class="card">
                <h2>Tirage au sort de l'élève</h2>
                <button onclick="tirerEleve()">Tirer un élève au hasard dans la classe</button>
                <h3 id="selected-student" style="color: #8e44ad; margin-top: 10px;">Aucun élève tiré</h3>
            </div>
        </div>

        <!-- Tableau des Scores des 6 Équipes -->
        <div>
            <div class="card">
                <h2>Scores des Équipes</h2>
                <div class="teams-grid" id="teams-container">
                    <!-- Généré dynamiquement pour 6 équipes -->
                </div>
            </div>
        </div>
    </div>

<script>
    // Simulation des listes d'élèves par classe
    const elevesParClasse = {
        "6A": ["Lucas", "Chloé", "Nathan", "Inès", "Thomas", "Manon", "Gabriel", "Sarah"],
        "6B": ["Hugo", "Jade", "Louis", "Louise", "Jules", "Alice", "Adam", "Lina"],
        "6C": ["Enzo", "Mila", "Raphaël", "Rose", "Arthur", "Emma", "Noah", "Léa"]
    };

    let scores = { "Équipe 1": 0, "Équipe 2": 0, "Équipe 3": 0, "Équipe 4": 0, "Équipe 5": 0, "Équipe 6": 0 };
    
    // Initialisation des équipes
    function initTeams() {
        const container = document.getElementById('teams-container');
        container.innerHTML = '';
        for (let [team, score] of Object.entries(scores)) {
            container.innerHTML += `
                <div class="team-box">
                    <h3>${team}</h3>
                    <div class="score" id="score-${team}">${score}</div>
                    <button onclick="modifierScore('${team}', 1)">+</button>
                    <button onclick="modifierScore('${team}', -1)">-</button>
                </div>
            `;
        }
    }

    function modifierScore(team, delta) {
        scores[team] += delta;
        document.getElementById(`score-${team}`).innerText = scores[team];
    }

    function tirerEleve() {
        const classe = document.getElementById('select-classe').value;
        const liste = elevesParClasse[classe];
        const eleveAleatoire = liste[Math.floor(Math.random() * liste.length)];
        document.getElementById('selected-student').innerText = `👉 Élève désigné : ${eleveAleatoire}`;
    }

    let interval;
    function lancerChrono() {
        let tempsRestant = 45; // Durée par défaut de la question
        const display = document.getElementById('timer-display');
        clearInterval(interval);
        interval = setInterval(() => {
            display.innerText = tempsRestant + " s";
            if (tempsRestant <= 0) {
                clearInterval(interval);
                display.innerText = "Temps écoulé !";
            }
            tempsRestant--;
        }, 1000);
    }

    function afficherCorrection() {
        document.getElementById('correction-box').style.display = 'block';
        document.getElementById('correction-text').innerText = "3 x 45 minutes = 135 minutes = 2h15mn (Exemple)";
    }

    function logout() {
        alert("Déconnexion simulée.");
    }

    initTeams();
</script>

</body>
</html>
